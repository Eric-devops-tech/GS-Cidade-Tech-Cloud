services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: empauta
      POSTGRES_USER: empauta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cidade-tech
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empauta -d empauta"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: ./api
    image: cidade-tech-api:local
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/empauta
      DB_USER: empauta
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      GESTOR_INICIAL_EMAIL: ${GESTOR_INICIAL_EMAIL:-}
      GESTOR_INICIAL_SENHA: ${GESTOR_INICIAL_SENHA:-}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8080:8080"
    networks:
      - cidade-tech
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

networks:
  cidade-tech:
    driver: bridge

volumes:
  postgres-data:
